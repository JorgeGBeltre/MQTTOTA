name=MQTTOTA
version=1.1.0
author=Jorge Gaspar Beltre Rivera
maintainer=Jorge Gaspar Beltre Rivera
sentence=Secure OTA firmware updates via MQTT/MQTTS for ESP32 with real SHA-256, HMAC-SHA256, and non-blocking restart.
paragraph=Robust Over-The-Air update system supporting both MQTT and MQTTS protocols. v1.1.0 adds: real SHA-256 integrity verification (mbedtls), HMAC-SHA256 firmware signature (setSecurityKey / requireSignature), StaticJsonDocument to eliminate heap fragmentation, non-blocking restart timer (no more blocking delay()), unified OTA state machine with full _setState() coverage, working getFreeOTASpace(), and automatic rollback cancellation on valid boot. Compatible with ESP32, ESP32-S2, ESP32-S3, ESP32-C3, ESP32-C6.
category=Communication
url=https://github.com/JorgeGBeltre/MQTTOTA
architectures=esp32,esp32s2,esp32s3,esp32c3,esp32c6
depends=ArduinoJson
includes=MQTTOTA.h
dot_a_linkage=false
